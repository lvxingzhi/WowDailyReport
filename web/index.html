<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>今日一报</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 幻灯片容器 -->
  <div id="slides-container">

    <!-- Slide 1: 赛季概览 -->
    <section class="slide" id="slide-1">
      <div class="slide-content">
        <div class="season-overview">
          <!-- 贴纸风标题 -->
          <div class="s1-title">今日一报</div>
          <div class="season-meta">
            <span class="season-meta-tag" id="ph-season"></span>
            <span class="season-meta-tag" id="ph-date"></span>
            <span class="season-meta-tag" id="ph-week"></span>
          </div>
          <div class="season-hero">
            <div class="hero-card">
              <div class="hero-value" id="so-week"></div>
              <div class="hero-label">当前赛季周</div>
            </div>
            <div class="hero-divider"></div>
            <div class="hero-card hero-accent">
              <div class="hero-value" id="so-remaining"></div>
              <div class="hero-label">预计剩余周数</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Slide 2: 分数大盘 + 趋势图 -->
    <section class="slide" id="slide-2">
      <div class="slide-content">
        <div class="slide-label">分数行情</div>
        <!-- 分数大盘 -->
        <div class="s2-score-dashboard">
          <div class="s2-score-row">
            <!-- 最高分数 -->
            <div class="s2-hero-card" id="s2-hero"></div>
            <!-- 核心百分比 -->
            <div class="s2-pct-group">
              <div class="s2-pct-core">
                <div class="s2-pct-card accent-purple" id="s2-pct01"></div>
                <div class="s2-pct-card accent-gold" id="s2-pct1"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- 折线图 -->
        <div class="chart-box" id="chart-score-trend"></div>
      </div>
    </section>

    <!-- Slide 3: 世界TOP + 限时最高层数 -->
    <section class="slide" id="slide-3">
      <div class="slide-content slide-top-dungeon">
        <div class="slide-label">世界 TOP</div>
        <div class="team-score" id="r1-score"></div>
        <div class="team-members" id="r1-team"></div>
        <div class="dungeon-compact-title">限时最高层数</div>
        <div class="dungeon-compact-list" id="dungeon-compact-list"></div>
      </div>
    </section>

    <!-- Slide 4: 强势阵容 -->
    <section class="slide" id="slide-4">
      <div class="slide-content">
        <div class="slide-label">强势阵容</div>
        <div class="lineup-groups" id="eco-lineup"></div>
      </div>
    </section>

    <!-- Slide 5: 专精分数排行 -->
    <section class="slide" id="slide-5">
      <div class="slide-content">
        <div class="slide-label">专精分数排行</div>
        <div class="faith-table" id="faith-table"></div>
      </div>
    </section>



  </div>

  <!-- 一图流容器（垂直长图） -->
  <div id="one-pager"></div>

  <!-- 导航 -->
  <div class="nav">
    <button class="nav-arrow nav-prev" id="nav-prev">◀</button>
    <div class="nav-dots" id="nav-dots"></div>
    <button class="nav-arrow nav-next" id="nav-next">▶</button>
    <div class="nav-divider"></div>
    <button class="btn-onepager" id="btn-onepager">一图流</button>
  </div>

  <!-- 页脚 -->
  <div class="card-footer">
    <span class="footer-brand">制作者: 西番芥</span>
    <span class="footer-social">
      B站 <span class="hl">西番芥</span> · space.bilibili.com/346688237
    </span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
