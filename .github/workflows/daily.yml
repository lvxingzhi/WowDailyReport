name: Update Daily Report

permissions:
  contents: write
  
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: '当天已有数据时是否覆盖更新（勾选=覆盖重写，不勾选=跳过）'
        required: false
        default: false
        type: boolean

  schedule:
    # 每天北京时间 08:05
    # UTC+8，所以 UTC 24:05
    - cron: "5 0 * * *"


jobs:
  update:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        pip install -r scripts/requirements.txt


    - name: Fetch Raider data
      env:
        OVERWRITE_TODAY: ${{ github.event.inputs.overwrite || 'false' }}
      run: |
        python scripts/fetch_rio_data.py


    - name: Parse Excel
      run: |
        python scripts/parse_excel.py


    - name: Commit changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

        git add .

        git commit -m "auto update daily report" || exit 0

        git push